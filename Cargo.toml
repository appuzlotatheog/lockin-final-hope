[package]
name = "lockin-final-hope"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Lockin — a local-first study and exam management desktop app"
build = "build.rs"

[dependencies]
slint = { version = "1.18", features = ["compat-1-2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rfd = "0.18"
directories = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3.7"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
